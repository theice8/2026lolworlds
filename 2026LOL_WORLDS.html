<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:dark;background:#0a1020}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>魔女大人的世界賽預測表 💜 小奈特製版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column. Scoreboard tiles on top, a per-day accuracy chart, then match cards you tap to pick a winner. Hex badges stand in for team logos. */
:root{
  --bg:#0a1020;--surface:#111a2e;--surface-2:#16213a;--line:#24324f;--fg:#e8edf7;--muted:#8d9ab6;
  --gold:#d6ae5a;--gold-ink:#1b1405;--gold-soft:rgba(214,174,90,.14);
  --ok:#3fcf8e;--ok-soft:rgba(63,207,142,.14);--bad:#ff6b6b;--bad-soft:rgba(255,107,107,.14);--warn:#f2b84b;
  --f-disp:"Barlow Condensed","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.mut{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font:600 12px var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-disp);font-size:38px;line-height:1.05;font-weight:700;text-wrap:balance}
.who{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.sync.on::before{background:var(--ok)}

.banner{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.banner.warn{border-color:rgba(242,184,75,.5);color:var(--fg)}

.stats{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-disp);font-size:34px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.tile.main .v{font-size:56px;color:var(--gold)}
@media (max-width:560px){.stats{grid-template-columns:repeat(3,1fr)}.tile.main{grid-column:1/-1}.tile .v{font-size:30px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2{font-size:16px;font-weight:700}
.chart{display:grid;gap:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.plot{position:relative;width:100%;height:100px;border-bottom:1px solid var(--line)}
.plot::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.bar{position:absolute;left:18%;right:18%;bottom:0;background:var(--gold);border-radius:3px 3px 0 0}
.bar.zero{background:var(--bad)}
.cl{font:600 14px var(--f-disp);margin-top:4px}
.cp{font-size:12px;font-variant-numeric:tabular-nums}
.cn{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:16px}

.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:8px 16px;border-radius:7px;font-weight:500;min-height:40px}
.seg button.on{background:var(--gold);color:var(--gold-ink)}

.days{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.days.ko{grid-template-columns:repeat(7,1fr)}
.day{border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center;background:var(--surface);min-width:0;display:flex;flex-direction:column;align-items:center;min-height:50px}
.day b{font:600 15px var(--f-disp)}
.day span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.day span.hit{color:var(--ok)}
.day.on{border-color:var(--gold);background:var(--gold-soft)}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dayhead h2{font-family:var(--f-disp);font-size:24px;font-weight:700}
.dayhead h2 small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--muted)}
.pill.ok{color:var(--ok);border-color:rgba(63,207,142,.5)}
.pill.bad{color:var(--bad);border-color:rgba(255,107,107,.5)}

.list{display:flex;flex-direction:column;gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.team{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0;text-align:center}
.team .code{font:700 22px/1 var(--f-disp);letter-spacing:.02em}
.team .nm{font-size:12px;color:var(--fg);line-height:1.3;text-wrap:balance}
.team .rg{font:600 11px var(--f-disp);letter-spacing:.1em;color:var(--muted)}
.team .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:20px}
.tag{font-size:11px;border-radius:4px;padding:0 6px;line-height:19px;border:1px solid var(--line);color:var(--muted)}
.tag.w{background:var(--ok-soft);color:var(--ok);border-color:rgba(63,207,142,.5)}
.tag.p{color:var(--gold);border-color:rgba(214,174,90,.5)}
.tag.p.ok{color:var(--ok);border-color:rgba(63,207,142,.5)}
.tag.p.bad{color:var(--bad);border-color:rgba(255,107,107,.5)}
.team.picked{border-color:var(--gold);background:var(--gold-soft)}
.team.right{border-color:var(--ok);background:var(--ok-soft)}
.team.wrong{border-color:var(--bad);background:var(--bad-soft)}
.team.won:not(.picked){border-color:rgba(63,207,142,.6)}
.team:not(:disabled):hover{border-color:var(--gold)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:52px}
.mid .bo{font:600 12px var(--f-disp);letter-spacing:.1em;color:var(--gold);border:1px solid rgba(214,174,90,.5);border-radius:4px;padding:0 6px}
.mid .vs{font:700 14px var(--f-disp);color:var(--muted);display:block}
.res{font-size:12px;color:var(--muted)}
.res.ok{color:var(--ok);font-weight:700}
.res.bad{color:var(--bad);font-weight:700}

.badge{display:inline-grid;place-items:center;width:46px;height:50px;background:var(--tc);color:var(--tx);
  clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);font:700 13px/1 var(--f-disp);letter-spacing:.02em}
.badge.sm{width:30px;height:33px;font-size:10px}

.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srow .lab{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);border-radius:8px;padding:7px 14px;min-height:40px;font:600 15px var(--f-disp);background:var(--surface-2);font-variant-numeric:tabular-nums}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip:disabled:not(.on):not(.ok):not(.bad){opacity:.5}
.link{font-size:13px;color:var(--muted);text-decoration:underline;padding:8px 4px;min-height:36px}
.link.danger{color:var(--bad)}
.btn{border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:9px 16px;font-weight:700;min-height:42px}
.btn.fill{background:var(--gold);color:var(--gold-ink)}
.btn:disabled{opacity:.4}
.hint{font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--fg)}

.add{display:flex;flex-direction:column;gap:12px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp .gl{font:700 15px var(--f-disp);color:var(--gold);letter-spacing:.06em}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.tc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 10px 4px 6px;background:var(--surface-2);font:700 15px var(--f-disp);min-height:44px}
.tc.on{border-color:var(--gold);background:var(--gold-soft)}
.tc:disabled{opacity:.35}
.warnl{font-size:13px;color:var(--warn)}

table{width:100%;border-collapse:collapse}
.scroll{overflow-x:auto}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.t{display:flex;align-items:center;gap:8px;font:700 16px var(--f-disp)}
td.t small{font:400 12px var(--f-body);color:var(--muted)}
.rank{font:700 20px var(--f-disp);width:28px;color:var(--gold)}
.me-tag{font-size:11px;color:var(--gold-ink);background:var(--gold);border-radius:4px;padding:0 6px;margin-left:6px}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--gold)}
.foot{font-size:12px;color:var(--muted);text-align:center}
.sharetxt{width:100%;min-height:200px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:14px/1.6 var(--f-body);resize:vertical}
.shareimg{display:block;width:100%;max-width:420px;border-radius:10px;border:1px solid var(--line)}
.smsg{font-size:13px;color:var(--ok);min-height:20px}

.tag.f{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.cd{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cd .t{font:700 26px/1.2 var(--f-disp);color:var(--gold);font-variant-numeric:tabular-nums}
.cd .l{font-size:13px;color:var(--muted)}
.cd .need{font-size:13px;color:var(--warn)}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fav{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);min-width:0}
.fav .ft{display:flex;flex-direction:column;min-width:0}
.fav .ft b{font:700 18px/1.1 var(--f-disp)}
.fav .ft span{font-size:12px;color:var(--muted)}
.fav.adv{border-color:var(--ok);background:var(--ok-soft)}
.fav.adv .ft span{color:var(--ok);font-weight:700}
.fav.out{opacity:.75;border-style:dashed}
.fav.out .badge{filter:grayscale(1)}
.fav.out .ft span{color:var(--bad)}
.path{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:4px;align-items:stretch}
.ax{font:600 12px var(--f-disp);color:var(--muted);display:grid;place-items:center;letter-spacing:.06em;padding:0 4px}
.pc{min-height:56px;border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;background:var(--surface-2);min-width:0}
.pc.win{background:var(--ok-soft);border-color:rgba(63,207,142,.4)}
.pc.lose{background:var(--bad-soft);border-color:rgba(255,107,107,.4)}
.pc.x{background:transparent;border-style:dashed;opacity:.35}
.fw{display:inline-block;filter:drop-shadow(0 0 2px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.rgrow{display:grid;grid-template-columns:56px 1fr 52px;gap:10px;align-items:center}
.rgrow b{font:700 15px var(--f-disp);letter-spacing:.05em}
.drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow b{font:700 16px var(--f-disp);min-width:34px}
.dchip{display:inline-flex;gap:4px;align-items:center;border-radius:6px;padding:2px 8px;font:700 14px var(--f-disp);border:1px solid;font-variant-numeric:tabular-nums}
.dchip.ok{color:var(--ok);border-color:rgba(63,207,142,.5);background:var(--ok-soft)}
.dchip.bad{color:var(--bad);border-color:rgba(255,107,107,.5);background:var(--bad-soft)}
.fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,8,18,.78);overflow:hidden;padding:20px}
.fx .card{position:relative;z-index:2;background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:26px 22px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:10px;align-items:center}
.fx.out .card{border-color:var(--line)}
.fx.out .badge{filter:grayscale(1)}
.fx h3{font:700 32px/1.15 var(--f-disp);text-wrap:balance}
.fx .cf{position:absolute;top:-16px;width:9px;height:14px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.fx .cf{display:none}}
</style>

</head>
<body>
<div id="app" class="wrap"></div>

<script>
(()=>{
'use strict';

const TEAMS={
  GEN:{n:'Gen.G',r:'LCK',c:'#d4a93a'},HLE:{n:'Hanwha Life',r:'LCK',c:'#ff7a1a'},T1:{n:'T1',r:'LCK',c:'#e3243b'},DK:{n:'Dplus KIA',r:'LCK',c:'#19b5c9'},
  AL:{n:"Anyone's Legend",r:'LPL',c:'#8b6cff'},BLG:{n:'Bilibili Gaming',r:'LPL',c:'#5f8fe8'},TES:{n:'Top Esports',r:'LPL',c:'#e6cf3a'},IG:{n:'Invictus Gaming',r:'LPL',c:'#aeb6c8'},
  G2:{n:'G2 Esports',r:'LEC',c:'#ff5d8f'},KC:{n:'Karmine Corp',r:'LEC',c:'#2b52d6'},MKOI:{n:'Movistar KOI',r:'LEC',c:'#b05cff'},
  TLAW:{n:'Team Liquid',r:'LCS',c:'#34c7f0'},LYON:{n:'LYON',r:'LCS',c:'#ffb347'},
  CFO:{n:'中信飛牡蠣',r:'LCP',c:'#14b88a'},TSW:{n:'Team Secret Whales',r:'LCP',c:'#f0a6ca'},
  LOS:{n:'LØS',r:'CBLOL',c:'#7ed957'}
};
const SWISS=[['10/24','六'],['10/25','日'],['10/26','一'],['10/27','二'],['10/29','四'],['10/30','五'],['10/31','六'],['11/1','日']];
const TIMES=['01:00','01:00','01:00','01:00','04:00','04:00','04:00','01:00'];
const ROUNDS=[1,2,3,3,4,4,5,5];
const DAYS=[];
SWISS.forEach((s,i)=>DAYS.push({d:i+1,short:'D'+(i+1),date:s[0],time:TIMES[i],full:s[0]+'（'+s[1]+'）'+TIMES[i]+' 台灣時間',ko:false,round:ROUNDS[i]}));
[['八強1','11/4','三','06:00','八強賽'],['八強2','11/5','四','06:00','八強賽'],['八強3','11/6','五','06:00','八強賽'],['八強4','11/7','六','06:00','八強賽'],['四強1','11/8','日','06:00','四強賽'],['四強2','11/9','一','06:00','四強賽'],['決賽','11/15','日','03:00','總決賽']].forEach((k,i)=>DAYS.push({d:9+i,short:k[0],date:k[1],time:k[3],full:k[4]+' · '+k[1]+'（'+k[2]+'）'+k[3]+' 台灣時間',ko:true}));
const ROUND_HINT={
  1:'首輪由抽籤決定，同賽區不會對上。',
  2:'第 2 輪：1-0 對 1-0、0-1 對 0-1。',
  3:'第 3 輪：2-0、1-1、0-2 各自同戰績對戰。2-0 與 0-2 為 BO3。',
  4:'第 4 輪：2-1 對 2-1、1-2 對 1-2，都是 BO3。',
  5:'第 5 輪：2-2 對 2-2，BO3，勝者晉級八強。'
};
const R1=[['GEN','IG'],['TLAW','CFO'],['AL','KC'],['G2','DK'],['HLE','TES'],['LOS','T1'],['TSW','LYON'],['BLG','MKOI']];
const SCORES={3:['2-0','2-1'],5:['3-0','3-1','3-2']};

const S={db:null,user:null,uid:null,name:'',live:false,ready:false,canEdit:false,canWrite:true,
  matches:{},mine:{},favs:[],favEdit:false,shareMode:'result',shareImg:null,shareBlob:null,dl:null,tab:'predict',day:1,dayInit:false,edit:false,
  add:{open:false,sel:[],bo:null},confirm:null,err:'',dirty:false,timer:null};

const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;p'}[c]||c));
const pct=(c,n)=>n?Math.round(c/n*100)+'%':'—';
const dash=s=>String(s).replace('-','–');

/* ---------- local persistence (per-browser only) ---------- */
const LS='worlds26-predictor-local-v1',UI='worlds26-predictor-ui-v1';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function persistLocal(){lsSet(LS,{matches:S.matches,mine:S.mine,favs:S.favs})}
function persistUi(){lsSet(UI,{tab:S.tab,day:S.day})}

/* ---------- data helpers ---------- */
function mlist(){return Object.values(S.matches).sort((a,b)=>(a.day-b.day)||((a.n||0)-(b.n||0))||(a.id<b.id?-1:1))}
function evalPicks(picks){
  const o={n:0,c:0,sn:0,sc:0,days:{},seq:[]};
  for(const m of mlist()){
    if(!m.winner)continue;
    const p=picks[m.id];if(!p||!p.w)continue;
    const ok=p.w===m.winner;
    o.n++;if(ok)o.c++;o.seq.push(ok);
    const d=o.days[m.day]||(o.days[m.day]={n:0,c:0});d.n++;if(ok)d.c++;
    if(m.bo>1&&p.s&&m.score){o.sn++;if(ok&&p.s===m.score)o.sc++}
  }
  let st=0;for(let i=o.seq.length-1;i>=0&&o.seq[i];i--)st++;
  let best=0,cur=0;o.seq.forEach(x=>{cur=x?cur+1:0;if(cur>best)best=cur});
  o.streak=st;o.best=best;return o;
}
function standings(){
  const r={};for(const k in TEAMS)r[k]={w:0,l:0};
  for(const m of mlist()){
    if(m.day>8||!m.winner)continue;
    const wn=m.winner==='a'?m.a:m.b,ls=m.winner==='a'?m.b:m.a;
    if(r[wn])r[wn].w++;if(r[ls])r[ls].l++;
  }
  return r;
}
function lum(hex){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return(0.299*r+0.587*g+0.114*b)/255}
function badge(code,sm){
  const t=TEAMS[code]||{c:'#667'};
  const tx=lum(t.c)>0.55?'#0a1020':'#ffffff';
  return '<span class="badge'+(sm?' sm':'')+'" style="--tc:'+t.c+';--tx:'+tx+'">'+esc(code)+'</span>';
}

/* ---------- writes ---------- */
let wq=Promise.resolve();
function queue(fn){wq=wq.then(fn).catch(e=>{console.warn(e);S.err='儲存失敗，請稍後再試。';render()})}
function savePicks(){
  S.dirty=true;S.shareImg=null;persistLocal();clearTimeout(S.timer);
  S.timer=setTimeout(()=>{
    if(!S.db||!S.uid){S.dirty=false;return}

    '</div></div>').join('');

    if(!bo){
      if(D.ko)bo=5;

  return '<section class="panel add"><div class="ph"><h2>新增對戰（'+D.short+'）</h2><button class="link" data-act="addcancel">收起</button></div>'+

    '<div class="srow"><button class="btn fill" data-act="addgo"'+(sel.length===2?'':' disabled')+'>加入賽程</button></div></section>';
}

    return '<div class="drow"><b>'+D.short+'</b><span class="num mut">'+x.c+'/'+x.n+'</span>'+chips+'</div>';
  }).join('');
  return '<section class="panel"><div class="ph"><h2>對各賽區的準確率</h2><span class="mut">依你選的勝方所屬賽區計算</span></div>'+rows+'</section>'+
    '<section class="panel"><div class="ph"><h2>每日回顧</h2></div>'+note+drows+'</section>';
}
const SEEN='worlds26-seen-v1';
const CELEB={
  adv8:{good:1,n:40,t:c=>'恭喜 '+c+' 晉級八強！',d:n=>n+' 拿下 3 勝，魔女大人的本命進入淘汰賽啦！'},
  adv4:{good:1,n:50,t:c=>'恭喜 '+c+' 晉級四強！',d:n=>n+' 贏下八強賽，繼續往前衝！'},
  advF:{good:1,n:60,t:c=>'恭喜 '+c+' 闖進總決賽！',d:n=>n+' 贏下四強賽，只差最後一步就能捧盃了！'},
  champ:{good:1,n:110,t:c=>'恭喜 '+c+' 奪得世界冠軍！',d:n=>n+' 捧起召喚師盃，魔女大人的本命就是世界第一！'},
  outS:{good:0,t:c=>'摸摸魔女大人…',d:n=>n+' 在瑞士輪止步了，謝謝他們帶來的精彩比賽。'},
  out8:{good:0,t:c=>'摸摸魔女大人…',d:n=>n+' 在八強賽止步，已經一路拚得很棒了！'},
  out4:{good:0,t:c=>'摸摸魔女大人…',d:n=>n+' 在四強賽止步，離總決賽只差一場，非常了不起！'},
  runner:{good:0,t:c=>'摸摸魔女大人…',d:n=>n+' 拿下亞軍，差一步就能捧盃，但已經是超強的亞軍啦！'}
};
function teamStatus(c,st){
  const r=st[c]||{w:0,l:0};
  let k='',lab=r.w+' 勝 '+r.l+' 敗',s='live';
  if(r.l>=3){k='outS';lab='瑞士輪止步';s='out'}
  else if(r.w>=3){k='adv8';lab='晉級八強';s='adv'}
  for(const m of mlist()){
    if(m.day<9||!m.winner||(m.a!==c&&m.b!==c))continue;
    const won=m[m.winner]===c,g=m.day<=12?'q':m.day<=14?'s':'f';
    if(g==='q'){if(won){k='adv4';lab='晉級四強';s='adv'}else{k='out8';lab='八強止步';s='out'}}
    else if(g==='s'){if(won){k='advF';lab='晉級總決賽';s='adv'}else{k='out4';lab='四強止步';s='out'}}
    else{if(won){k='champ';lab='世界冠軍';s='adv'}else{k='runner';lab='亞軍';s='out'}}
  }
  return {k,lab,s};
}
function celebrate(code,kind){
  const t=TEAMS[code]||{n:code,c:'#d6ae5a'},cf0=CELEB[kind];if(!cf0)return;
  const el=document.createElement('div');
  el.className='fx'+(cf0.good?'':' out');
  let cf='';
  if(cf0.good){const cols=[t.c||'#d6ae5a','#d6ae5a','#ffffff'];for(let i=0;i<cf0.n;i++)cf+='<i class="cf" style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+cols[i%3]+';animation-duration:'+(2.4+Math.random()*2.2).toFixed(2)+'s;animation-delay:'+(Math.random()*1.2).toFixed(2)+'s"></i>'}
  el.innerHTML=cf+'<div class="card" role="dialog" aria-label="本命隊伍">'+badge(code)+'<h3>'+esc(cf0.t(code))+'</h3><p class="hint">'+esc(cf0.d(code+'（'+t.n+'）'))+'</p><button class="btn fill" data-fx="close">知道了</button></div>';
  el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-fx]'))el.remove()});
  document.body.appendChild(el);
}
function checkFav(){
  if(!S.ready||!S.favs.length||document.querySelector('.fx'))return;
  const st=standings(),seen=lsGet(SEEN)||{};
  for(const c of S.favs){
    const k=teamStatus(c,st).k;
    if(!k){if(seen[c]){delete seen[c];lsSet(SEEN,seen)}continue}
    if(seen[c]!==k){seen[c]=k;lsSet(SEEN,seen);celebrate(c,k);return}
  }
}
function sharePickLine(m,p){
  const w=m[p.w],l=m[p.w==='a'?'b':'a'];
  const mk=m.winner?(p.w===m.winner?' ✓':' ✗'):'';
  return w+' 勝 '+l+(p.s?'（'+dash(p.s)+'）':'')+mk;
}
function shareText(ev){
  const st=standings(),L=[];
  if(S.shareMode==='picks'){
    L.push('💜 魔女大人與小奈的世界賽 2026 預測');
    const byDay={};
    mlist().forEach(m=>{const p=S.mine[m.id];if(p&&p.w)(byDay[m.day]=byDay[m.day]||[]).push(sharePickLine(m,p))});
    const ds=DAYS.filter(D=>byDay[D.d]);
    if(!ds.length)L.push('還沒有預測。');
    ds.forEach(D=>{L.push('');L.push(D.short+(D.date?'（'+D.date+'）':''));byDay[D.d].forEach(x=>L.push(x))});
  }else{
    L.push('💜 魔女大人與小奈的世界賽 2026 預測戰績');
    if(ev.n){
      L.push('命中 '+ev.c+'/'+ev.n+'（'+pct(ev.c,ev.n)+'）');
      if(ev.sn)L.push('比數命中 '+ev.sc+'/'+ev.sn);
      L.push('目前連對 '+ev.streak+'，最長連對 '+ev.best);
      L.push('每日：'+DAYS.filter(D=>ev.days[D.d]).map(D=>D.short+' '+ev.days[D.d].c+'/'+ev.days[D.d].n).join('、'));
    }else L.push('還沒有結算的場次。');
    if(S.favs.length)L.push('本命：'+S.favs.map(c=>c+'（'+teamStatus(c,st).lab+'）').join('、'));
  }
  return L.join('\n');
}
function shareView(ev){
  const mb=(k,l)=>'<button data-act="smode" data-v="'+k+'" class="'+(S.shareMode===k?'on':'')+'">'+l+'</button>';
  let h='<section class="panel"><div class="ph"><h2>分享文字</h2><span class="mut">貼到 LINE 或社群與大家分享</span></div>'+
    '<div class="seg">'+mb('result','我的戰績')+mb('picks','我的預測')+'</div>'+
    '<textarea class="sharetxt" id="sharetxt" readonly>'+esc(shareText(ev))+'</textarea>'+
    '<div class="srow"><button class="btn fill" data-act="copy">複製文字</button><span class="smsg" id="smsg"></span></div></section>';
  h+='<section class="panel"><div class="ph"><h2>分享圖片</h2><span class="mut">產生精美戰績卡，隨時炫耀或留作紀念</span></div>'+
    '<div class="srow"><button class="btn'+(S.shareImg?'':' fill')+'" data-act="mkimg">'+(S.shareImg?'重新產生':'產生圖片')+'</button>'+
    (S.shareImg&&S.dl?'<button class="btn fill" data-act="saveimg">存成圖片</button>':'')+'<span class="smsg" id="smsg2"></span></div>'+
    (S.shareImg?'<img class="shareimg" src="'+S.shareImg+'" alt="魔女大人的世界賽預測戰績卡"><p class="hint">手機也可以長按圖片儲存喔！</p>':'')+'</section>';
  return h;
}
function hexPath(x,l,t,w,h){
  x.beginPath();x.moveTo(l+w*.25,t+h*.03);x.lineTo(l+w*.75,t+h*.03);x.lineTo(l+w,t+h*.5);
  x.lineTo(l+w*.75,t+h*.97);x.lineTo(l+w*.25,t+h*.97);x.lineTo(l,t+h*.5);x.closePath();
}
function roundRect(x,l,t,w,h,r){
  x.beginPath();x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath();
}
async function drawCard(ev){
  try{await Promise.all([document.fonts.load('700 100px "Barlow Condensed"','0123456789%'),document.fonts.load('700 40px "Noto Sans TC"','魔女大人的世界賽預測表準確率命中連對本命晉級八強四強總決賽冠軍亞軍淘汰止步瑞士輪每日比數最長目前場'),document.fonts.load('500 30px "Noto Sans TC"','魔女大人的世界賽預測表準確率命中連對本命')])}catch(e){}
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  const F='"Barlow Condensed","Noto Sans TC",sans-serif',B='"Noto Sans TC",system-ui,sans-serif';
  const gold='#d6ae5a',fg='#e8edf7',mut='#8d9ab6',line='#24324f',surf='#111a2e';
  x.fillStyle='#0a1020';x.fillRect(0,0,W,H);
  x.textBaseline='alphabetic';x.textAlign='left';
  x.fillStyle=gold;x.font='600 34px '+F;x.fillText('WORLDS 2026 · '+stageNow()[1].toUpperCase()+' 💜 小奈應援版',72,110);
  x.fillStyle=fg;x.font='700 76px '+B;x.fillText('魔女大人的世界賽預測',72,204);
  x.fillStyle=gold;x.font='700 330px '+F;x.fillText(ev.n?pct(ev.c,ev.n):'—',72,520);
  x.fillStyle=mut;x.font='500 36px '+B;x.fillText('整體準確率 · 命中 '+ev.c+'/'+ev.n+' 場',72,584);
  [['比數命中',ev.sc+'/'+ev.sn],['目前連對',String(ev.streak)],['最長連對',String(ev.best)]].forEach((b,i)=>{
    const bx=72+i*320,by=640,bw=296,bh=150;
    x.fillStyle=surf;roundRect(x,bx,by,bw,bh,16);x.fill();x.strokeStyle=line;x.lineWidth=2;x.stroke();
    x.fillStyle=mut;x.font='500 30px '+B;x.fillText(b[0],bx+28,by+52);
    x.fillStyle=fg;x.font='700 72px '+F;x.fillText(b[1],bx+28,by+122);
  });
  x.fillStyle=mut;x.font='500 30px '+B;x.fillText('每日準確率',72,860);
  const base=1040,maxH=140,ds=DAYS.filter(D=>ev.days[D.d]);
  x.strokeStyle=line;x.lineWidth=2;x.beginPath();x.moveTo(72,base);x.lineTo(W-72,base);x.stroke();
  if(ds.length){
    const n=Math.max(ds.length,8),cw=(W-144)/n;
    ds.forEach((Dd,i)=>{
      const d=ev.days[Dd.d],r=d.c/d.n,h=Math.max(r*maxH,6),cx=72+i*cw+cw/2,bw=Math.min(cw*.56,64);
      x.fillStyle=d.c?gold:'#ff6b6b';x.fillRect(cx-bw/2,base-h,bw,h);
      x.textAlign='center';x.fillStyle=fg;x.font='700 30px '+F;x.fillText(Math.round(r*100)+'%',cx,base-h-12);
      x.fillStyle=mut;x.font='600 28px '+F;x.fillText(Dd.short,cx,base+38);
    });
    x.textAlign='left';
  }else{x.fillStyle=mut;x.font='500 30px '+B;x.fillText('還沒有結算的場次',72,base-60)}
  if(S.favs.length){
    const st=standings();
    x.fillStyle=mut;x.font='500 30px '+B;x.fillText('本命隊伍',72,1146);
    S.favs.slice(0,6).forEach((c,i)=>{
      const t=TEAMS[c]||{c:'#667'},l=72+i*160;
      hexPath(x,l,1166,66,72);x.fillStyle=t.c;x.fill();
      x.textAlign='center';x.fillStyle=lum(t.c)>0.55?'#0a1020':'#ffffff';x.font='700 24px '+F;x.fillText(c,l+33,1210);
      x.fillStyle=mut;x.font='500 24px '+B;x.fillText(teamStatus(c,st).lab,l+33,1274);
      x.textAlign='left';
    });
  }
  x.fillStyle=mut;x.font='500 24px '+B;x.fillText('小奈與魔女大人的世界賽預測 💜',72,1332);
  S.shareBlob=await new Promise(r=>cv.toBlob(r,'image/png'));
  return cv.toDataURL('image/png');
}
function render(){
  const ev=evalPicks(S.mine);
  let h=headerView()+bannerView()+cdView()+statsView(ev)+favView()+chartView(ev)+navView();
  h+=S.tab==='predict'?predictView(ev):S.tab==='table'?tableView():S.tab==='recap'?recapView(ev):shareView(ev);
  h+='<p class="foot">隊伍徽章為示意用的六角標記，不是官方標誌。時間為台灣時間。 💜 Powered by 小奈</p>';
  h+=S.resetAsk?'<p class="foot">會清掉所有預測、賽果和本命隊伍，無法復原。<button class="link danger" data-act="resetok">確定清除</button><button class="link" data-act="resetno">取消</button></p>':'<p class="foot"><button class="link" data-act="reset">重設我的全部資料</button></p>';
  app.innerHTML=h;
  checkFav();
}

/* ---------- actions ---------- */
function act(d){
  const a=d.act;
  if(a==='tab'){S.tab=d.v;persistUi();render();return}
  if(a==='day'){S.day=+d.v;S.add={open:false,sel:[],bo:null};S.confirm=null;persistUi();render();return}
  if(a==='edit'){S.edit=d.v==='1';S.confirm=null;render();return}
  if(a==='pick'){
    const m=S.matches[d.mid];if(!m||m.winner||!S.canWrite)return;
    const cur=S.mine[m.id];
    if(cur&&cur.w===d.side)delete S.mine[m.id];else S.mine[m.id]={w:d.side,s:''};
    savePicks();render();return;
  }
  if(a==='score'){
    const m=S.matches[d.mid],p=S.mine[d.mid];if(!m||!p||m.winner||!S.canWrite)return;
    p.s=p.s===d.v?'':d.v;savePicks();render();return;
  }
  if(a==='win'){
    const m=S.matches[d.mid];if(!m||!S.canEdit)return;
    updateMatch(m.id,{winner:m.winner===d.side?null:d.side,score:''});return;
  }
  if(a==='res'){
    const m=S.matches[d.mid];if(!m||!S.canEdit)return;
    updateMatch(m.id,{score:m.score===d.v?'':d.v});return;
  }
  if(a==='clear'){updateMatch(d.mid,{winner:null,score:''});return}
  if(a==='del'){S.confirm=d.mid;render();return}
  if(a==='delno'){S.confirm=null;render();return}
  if(a==='delok'){removeMatch(d.mid);return}
  if(a==='reset'){S.resetAsk=true;render();return}
  if(a==='resetno'){S.resetAsk=false;render();return}
  if(a==='resetok'){
    S.resetAsk=false;S.matches=seedMatches();S.mine={};S.favs=[];S.day=1;S.edit=false;S.add={open:false,sel:[],bo:null};
    try{localStorage.removeItem(SEEN)}catch(e){}
    savePicks();render();return;
  }
  if(a==='smode'){S.shareMode=d.v;render();return}
  if(a==='copy'){
    const t=shareText(evalPicks(S.mine));
    const note=m=>{const e=document.getElementById('smsg');if(e)e.textContent=m};
    const fb=()=>{const ta=document.getElementById('sharetxt');if(ta){ta.focus();ta.select()}note('無法自動複製，已選取文字，請長按後複製。')};
    try{navigator.clipboard.writeText(t).then(()=>note('已複製，貼到 LINE 或社群就能分享。'),fb)}catch(e){fb()}
    return;
  }
  if(a==='mkimg'){
    drawCard(evalPicks(S.mine)).then(u=>{S.shareImg=u;render()}).catch(()=>{S.err='產生圖片失敗，請再試一次。';render()});
    return;
  }
  if(a==='saveimg'){
    if(S.dl&&S.shareBlob)S.dl.save({filename:'worlds2026-prediction.png',data:S.shareBlob}).catch(e=>{
      if(e&&e.code!=='declined'){const m=document.getElementById('smsg2');if(m)m.textContent='這裡無法直接存檔，請長按圖片儲存。'}
    });
    return;
  }
  if(a==='favedit'){S.favEdit=!S.favEdit;render();return}
  if(a==='fav'){
    if(!S.canWrite)return;
    const i=S.favs.indexOf(d.team);
    if(i>=0)S.favs.splice(i,1);else S.favs.push(d.team);
    savePicks();render();return;
  }
  if(a==='addopen'){S.add={open:true,sel:[],bo:null};render();return}
  if(a==='addcancel'){S.add={open:false,sel:[],bo:null};render();return}
  if(a==='addpick'){
    const s=S.add.sel,i=s.indexOf(d.team);
    if(i>=0)s.splice(i,1);else{if(s.length>=2)s.shift();s.push(d.team)}
    S.add.bo=null;render();return;
  }
  if(a==='addbo'){S.add.bo=+d.v;render();return}
  if(a==='addgo'){
    const s=S.add.sel;if(s.length!==2)return;
    const D=DAYS[S.day-1],st=standings();
    let bo=S.add.bo;
    if(!bo){
      if(D.ko)bo=5;
      else{const x=recOf(st,s[0]),y=recOf(st,s[1]);bo=(x.w===2||x.l===2||y.w===2||y.l===2)?3:1}
    }
    const n=mlist().filter(m=>m.day===S.day).reduce((mx,m)=>Math.max(mx,m.n||0),0)+1;
    const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const m={id,day:S.day,n,stage:D.ko?'ko':'swiss',a:s[0],b:s[1],bo,winner:null,score:''};
    S.matches[id]=m;writeMatch(m);
    S.add={open:false,sel:[],bo:null};render();return;
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  act(b.dataset);
});

/* ---------- boot ---------- */
function pickFirstDay(){
  if(S.dayInit)return;
  S.dayInit=true;
  const ui=lsGet(UI);
  if(ui&&ui.tab&&['predict','table','recap','share'].includes(ui.tab))S.tab=ui.tab;
  const ms=mlist();
  const open=ms.find(m=>!m.winner);
  S.day=open?open.day:(ms.length?ms[ms.length-1].day:1);
}
async function boot(){
  const c=window.claude;
  S.canEdit=true;S.canWrite=true;
  const saved=lsGet(LS);
  if(saved&&saved.matches&&Object.keys(saved.matches).length){S.matches=saved.matches;S.mine=saved.mine||{};S.favs=saved.favs||[]}
  else{S.matches=seedMatches();S.mine=(saved&&saved.mine)||{};S.favs=(saved&&saved.favs)||[];persistLocal()}
  S.ready=true;pickFirstDay();render();
  let db=null,user=null,cloud=false;
  try{if(c&&c.use){const r=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')]);db=r[0];user=r[1];S.dl=r[2]}}catch(e){}
  if(user){
    try{
      S.user=user;S.uid=await user.id();
      const me=await user.me();S.name=me.name||'';
      cloud=(await user.can('data.write'))!==false;
    }catch(e){}
  }
  if(db&&S.uid&&cloud){
    S.db=db;S.live=true;render();
    let first=true;
    db.doc('data/users/'+S.uid+'/picks').onSnapshot(snap=>{
      const x=snap.exists?snap.data():null;
      if(x&&!S.dirty){
        S.mine=JSON.parse(JSON.stringify(x.picks||{}));
        S.favs=Array.isArray(x.favs)?x.favs.slice():[];
        if(x.matches&&Object.keys(x.matches).length)S.matches=JSON.parse(JSON.stringify(x.matches));
      }
      if(first){first=false;S.dayInit=false;pickFirstDay();if(!x||!x.matches)savePicks()}
      persistLocal();render();
    },()=>{S.err='無法讀取雲端資料，目前只存在這個瀏覽器。';S.live=false;S.db=null;render()});
  }
}
boot();
setInterval(()=>{
  const el=document.getElementById('cdt');if(!el)return;
  const d=STARTS[+el.dataset.i]-Date.now();
  if(d<=0)render();else el.textContent=fmtLeft(d);
},30000);
})();
